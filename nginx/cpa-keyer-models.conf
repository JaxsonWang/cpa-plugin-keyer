# English: Nginx configuration snippet for filtering the CPA model list by downstream Keyer key. | 中文：CPA Keyer 按下游 Key 过滤模型列表的 Nginx 配置片段。
#
# English: Usage. | 中文：使用方式。
#
# English: 1. Replace HOST and PORT with CPA's internal listener, such as its container service name and internal port. | 中文：1. 将 HOST 和 PORT 替换为 CPA 的内部监听地址，例如容器服务名和内部端口。
#
# English: 2. HOST:PORT must connect directly to CPA and must not point to this public Nginx endpoint, which would create a proxy loop. | 中文：2. HOST:PORT 必须直连 CPA，不能指向当前 Nginx 公共入口，否则会形成代理循环。
#
# English: 3. Include this file inside the existing server {} block, or copy the location blocks below into it. | 中文：3. 将本文件 include 到现有站点的 server {} 中，或复制下面的 location 块。
#
# English: 4. Run nginx -t after replacing the placeholders, and reload Nginx only after the check succeeds. | 中文：4. 修改完成后先执行 nginx -t，检查通过后再重载 Nginx。
#
# English: Request behavior. | 中文：请求行为。
#
# English: A valid, enabled Keyer key with model-list access sees only the models allowed by its effective policy. | 中文：有效、启用且允许模型列表的 Keyer Key 只会看到当前策略允许的模型。
#
# English: A known but disabled, expired, or model-list-disabled Keyer key keeps the 401 response and does not fall back. | 中文：已知但禁用、过期或关闭模型列表权限的 Keyer Key 保持 401，不会回退。
#
# English: A credential unknown to Keyer returns 418, which Nginx internally forwards to CPA's native model list. | 中文：Keyer 不认识的凭据返回 418，由 Nginx 内部转发到 CPA 原生模型列表。
#
# English: Every location uses exact matching, so chat, response, streaming, and other inference endpoints remain unchanged. | 中文：所有 location 均使用精确匹配，不会改变聊天、响应、流式传输或其他推理接口。

# English: Filter the standard OpenAI-compatible model-list path. | 中文：过滤标准 OpenAI 模型列表路径。
location = /v1/models {
    # English: Allow Nginx to intercept the 418 status reserved by Keyer for internal fallback. | 中文：允许 Nginx 捕获 Keyer 专用于内部回退的 418 状态。
    proxy_intercept_errors on;

    # English: Internally redirect to CPA's native /v1/models only when Keyer returns 418. | 中文：仅当 Keyer 返回 418 时，内部跳转到 CPA 原生 /v1/models。
    error_page 418 = /__cpa_keyer_native_v1_models;

    # English: Send every model-list request to Keyer's per-key filtering resource first. | 中文：所有模型列表请求先进入 Keyer 的按 Key 过滤资源。
    proxy_pass http://HOST:PORT/v0/resource/plugins/cpa-keyer/viewer/models;

    # English: Preserve the caller credential so Keyer can evaluate key identity and model-list access. | 中文：原样传递调用方凭据，供 Keyer 判断 Key 身份和模型权限。
    proxy_set_header Authorization $http_authorization;

    # English: Preserve the original Host so CPA's existing host-dependent behavior remains unchanged. | 中文：保留原始 Host，避免改变 CPA 当前基于 Host 的请求行为。
    proxy_set_header Host $host;
}

# English: Internal fallback for CPA's native /v1/models; external requests cannot access it directly. | 中文：CPA 原生 /v1/models 的内部回退入口，外部请求不能直接访问。
location = /__cpa_keyer_native_v1_models {
    # English: Accept only Nginx internal redirects initiated by error_page. | 中文：只允许由 error_page 发起的 Nginx 内部跳转。
    internal;

    # English: Pass credentials unknown to Keyer to CPA's native authentication chain and global model list. | 中文：将 Keyer 不认识的凭据交给 CPA 原生认证链和全局模型列表。
    proxy_pass http://HOST:PORT/v1/models;

    # English: Continue forwarding the original credential and Host after the internal redirect. | 中文：内部跳转后继续传递原始凭据和 Host。
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
}

# English: Filter the compatible model-list path that includes the /openai prefix. | 中文：过滤带 /openai 前缀的兼容模型列表路径。
location = /openai/v1/models {
    # English: Allow Nginx to intercept the 418 status reserved by Keyer for internal fallback. | 中文：允许 Nginx 捕获 Keyer 专用于内部回退的 418 状态。
    proxy_intercept_errors on;

    # English: Internally redirect to CPA's native /openai/v1/models only when Keyer returns 418. | 中文：仅当 Keyer 返回 418 时，内部跳转到 CPA 原生 /openai/v1/models。
    error_page 418 = /__cpa_keyer_native_openai_v1_models;

    # English: Both public model-list paths use the same Keyer filtering resource. | 中文：两个公共模型列表路径共用同一个 Keyer 过滤资源。
    proxy_pass http://HOST:PORT/v0/resource/plugins/cpa-keyer/viewer/models;

    # English: Preserve the caller credential and Host. | 中文：原样传递调用方凭据和 Host。
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
}

# English: Internal fallback for CPA's native /openai/v1/models; external requests cannot access it directly. | 中文：CPA 原生 /openai/v1/models 的内部回退入口，外部请求不能直接访问。
location = /__cpa_keyer_native_openai_v1_models {
    # English: Accept only Nginx internal redirects initiated by error_page. | 中文：只允许由 error_page 发起的 Nginx 内部跳转。
    internal;

    # English: Pass credentials unknown to Keyer to CPA's native authentication chain and global model list. | 中文：将 Keyer 不认识的凭据交给 CPA 原生认证链和全局模型列表。
    proxy_pass http://HOST:PORT/openai/v1/models;

    # English: Continue forwarding the original credential and Host after the internal redirect. | 中文：内部跳转后继续传递原始凭据和 Host。
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
}
